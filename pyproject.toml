[project]
name = "equity-scout"
version = "0.1.0"
description = "Local, free global stock funnel — research assistant, not investment advice."
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "lxml>=6.1.1",
    # pandas/numpy: time-series panels, returns, and performance metrics for the backtest engine
    # (and a prerequisite for the later ML phases). Already present transitively via yfinance;
    # declared explicitly because the strategy engine depends on them directly.
    "pandas>=2.2",
    "numpy>=1.26",
    # ML meta-model (Phase E): elastic-net logistic + purged walk-forward. scikit-learn/scipy are
    # BSD-licensed and free (unlike mlfinlab, which is proprietary). scipy also enables yfinance repair.
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
