# Baut die Cockpit-App als Android-APK — kostenlos auf GitHub-Runnern, weil dort JDK und
# Android-SDK schon liegen (lokal in WSL fehlt beides, und ein SDK von Hand nachzuziehen
# ist ~1,5 GB für einen Build, der hier zweimal im Jahr läuft).
#
# Technik: Trusted Web Activity (TWA) via Bubblewrap. Die App ist ein Vollbild-Chrome auf
# die eigene Cockpit-Adresse — kein zweites Frontend, keine zweite Codebasis. Das ist auch
# der Grund für diese Bauweise statt einer WebView-App: eine TWA läuft in echtem Chrome
# und kann deshalb WEB PUSH. Eine Android-WebView kann das nicht, und Push war der ganze
# Anlass (Nico, 2026-08-27).
#
# Voraussetzungen (einmalig, siehe docs/handy-app.md):
#   - Secret ANDROID_KEYSTORE_B64      base64 des PKCS12-Keystores
#   - Secret ANDROID_KEYSTORE_PASSWORD dessen Passwort
#   - Die Cockpit-Adresse muss per HTTPS erreichbar sein und
#     /.well-known/assetlinks.json mit dem Fingerprint dieses Keystores ausliefern.
name: Android-APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Cockpit-Adresse ohne https:// (z. B. wsl-claude.tail7dff17.ts.net)"
        required: true
        type: string
      app_name:
        description: "Name unter dem Icon"
        required: false
        default: "Equity Scout"
        type: string
      version_code:
        description: "Fortlaufende Zahl; muss bei jedem Update steigen"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Keystore aus dem Secret herstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 fehlt — siehe docs/handy-app.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"

      - name: Bubblewrap installieren
        run: npm install -g @bubblewrap/cli@latest

      # Ohne diese Datei fragt Bubblewrap beim ersten Lauf interaktiv
      # "Do you want Bubblewrap to install the Android SDK?" und bricht auf dem Runner
      # mit Exit 130 ab, weil dort niemand antwortet (passiert am 2026-08-28, Run
      # 33163688184). Der Runner bringt SDK und JDK schon mit - hier wird nur darauf
      # gezeigt, statt 1,5 GB ein zweites Mal herunterzuladen.
      - name: Bubblewrap auf das vorinstallierte SDK zeigen
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Kein Android-SDK auf dem Runner gefunden"
            exit 1
          fi
          echo "SDK-Inhalt:"; ls -1 "$SDK"
          # Bubblewrap akzeptiert ein SDK nur, wenn darin `tools/` ODER `bin/` liegt
          # (AndroidSdkTools.validatePath, @bubblewrap/core 1.25). Moderne SDKs - auch das
          # des Runners - haben stattdessen nur `cmdline-tools/<version>/bin`, weshalb der
          # Build sonst mit "The provided androidSdk isn't correct." abbricht. Der Symlink
          # stellt genau die eine erwartete Stelle her, ohne am SDK selbst zu drehen.
          if [ ! -d "$SDK/tools" ] && [ ! -d "$SDK/bin" ]; then
            CLT="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort | tail -1)"
            if [ -z "$CLT" ]; then
              echo "::error::Weder tools/, bin/ noch cmdline-tools/*/bin im SDK gefunden"
              exit 1
            fi
            sudo ln -s "$CLT" "$SDK/bin"
            echo "Symlink gesetzt: $SDK/bin -> $CLT"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK" \
            > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      # Bubblewrap LÄDT die Icons aus dem Manifest herunter, um sie ins Android-Projekt
      # zu legen - `--skipPwaValidation` schaltet nur die PWA-Prüfung ab, nicht das Laden.
      # Die Cockpit-Adresse liegt im Tailnet und ist vom Runner aus nicht auflösbar
      # (ENOTFOUND, Run 33164243709); früher verdeckte ein `|| true` das, und das erzeugte
      # Projekt war stillschweigend unvollständig. Die Icons liegen aber ohnehin im Repo,
      # also werden sie hier lokal ausgeliefert - das funktioniert auch, wenn das Repo
      # eines Tages privat ist, anders als ein raw.githubusercontent.com-Link.
      - name: Icons lokal ausliefern
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8099 \
            --directory "$GITHUB_WORKSPACE/frontend/public" >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/icons/icon-512.png; then
              echo "Icon-Server steht."; exit 0
            fi
            sleep 0.5
          done
          echo "::error::Icon-Server kam nicht hoch"
          exit 1

      - name: TWA erzeugen
        env:
          HOST: ${{ inputs.host }}
          APP_NAME: ${{ inputs.app_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twa" && cd "$RUNNER_TEMP/twa"
          # Bubblewrap liest normalerweise das Web-App-Manifest von der Zieladresse. Die
          # steht hier im Tailnet und ist vom Runner aus NICHT erreichbar, also wird das
          # Manifest hier direkt geschrieben. Die Werte spiegeln
          # frontend/public/manifest.webmanifest — beide müssen zusammenpassen, sonst
          # zeigt die App andere Farben als die Website.
          cat > twa-manifest.json <<JSON
          {
            "packageId": "net.sutheimernico.equityscout",
            "host": "${HOST}",
            "name": "${APP_NAME}",
            "launcherName": "${APP_NAME}",
            "display": "standalone",
            "themeColor": "#0f1114",
            "navigationColor": "#0f1114",
            "backgroundColor": "#0f1114",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "http://127.0.0.1:8099/icons/icon-512.png",
            "maskableIconUrl": "http://127.0.0.1:8099/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "${RUNNER_TEMP}/keystore.p12", "alias": "equity-scout" },
            "appVersionName": "1.0.${VERSION_CODE}",
            "appVersionCode": ${VERSION_CODE},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://${HOST}/manifest.webmanifest",
            "fallbackType": "customtabs",
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://${HOST}/",
            "minSdkVersion": 23,
            "orientation": "default"
          }
          JSON
          # Unsere Fassung sichern, BEVOR init sie anfassen kann.
          cp twa-manifest.json /tmp/ours-manifest.json

          # --skipPwaValidation: die Adresse ist vom Runner aus nicht erreichbar, die
          # Prüfung würde also an der Erreichbarkeit scheitern, nicht an der App.
          # init holt sich das Web-Manifest von der Zieladresse und scheitert deshalb
          # im Tailnet zwangsläufig. Das Projekt erzeugt `update` weiter unten aus
          # unserem lokalen Manifest, also ist das hier bewusst folgenlos.
          bubblewrap init --manifest="https://${HOST}/manifest.webmanifest" \
            --directory=. --skipPwaValidation < /dev/null || \
            echo "init übersprungen (Zieladresse vom Runner nicht erreichbar)"

          # init überschreibt das Manifest, wenn es die Adresse doch erreicht — hier zählt
          # unseres. Erst danach `update`, denn update generiert das Android-Projekt AUS
          # dem Manifest und schreibt die passende manifest-checksum.txt. Die frühere
          # Reihenfolge kopierte das Manifest NACH dem update zurück und machte damit die
          # Prüfsumme ungültig — `build` fragte dann interaktiv nach und starb auf dem
          # Runner mit Exit 130 (2026-08-28, Run 33164085475).
          cp /tmp/ours-manifest.json twa-manifest.json
          bubblewrap update --skipVersionUpgrade < /dev/null

          # Sicherheitsnetz: manifest-checksum.txt ist sha1(twa-manifest.json) im Klartext
          # (shared.js computeChecksum). Fehlt oder hinkt sie, fragt `build` wieder.
          sha1sum twa-manifest.json | cut -d" " -f1 > manifest-checksum.txt
          echo "Checksumme: $(cat manifest-checksum.txt)"

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twa"
          bubblewrap build --skipPwaValidation \
            --signingKeyPassword="$KEYSTORE_PASSWORD" \
            --keystorePassword="$KEYSTORE_PASSWORD" < /dev/null
          ls -la ./*.apk ./*.aab || true

      - name: Fingerprint für assetlinks.json ausgeben
        run: |
          cd "$RUNNER_TEMP/twa"
          if [ -f assetlinks.json ]; then
            echo "### assetlinks.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat assetlinks.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: equity-scout-apk
          path: |
            ${{ runner.temp }}/twa/*.apk
            ${{ runner.temp }}/twa/assetlinks.json
          if-no-files-found: error
          retention-days: 30
